name: Build

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Paper 1.21.x - the primary target and the default of a plain build.
          - target: paper121
            label: mc1.21
          # Paper 26.x (CalVer). Ships Adventure 5, so it needs its own jar.
          - target: paper26
            label: mc26
    name: build (${{ matrix.target }})
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          ./gradlew build --console=plain -Ptarget=${{ matrix.target }} 2>&1 \
            | grep -vE '^\s+at ' | tail -80

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ArabicTranslator-${{ matrix.label }}
          path: build/libs/ArabicTranslator-*-${{ matrix.label }}.jar
          if-no-files-found: error
