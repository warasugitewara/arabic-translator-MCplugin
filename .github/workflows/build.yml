name: Build

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Latest published Paper API versions
        run: |
          curl -s https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api/maven-metadata.xml \
            | grep -o '<version>[^<]*</version>' | tail -12

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ArabicTranslator
          path: build/libs/ArabicTranslator-*.jar
          if-no-files-found: error
