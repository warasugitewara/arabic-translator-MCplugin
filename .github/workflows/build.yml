name: Build

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Latest published Paper API versions
        run: |
          BASE=https://repo.papermc.io/repository/maven-public/io/papermc/paper/paper-api
          echo "=== all versions ==="
          curl -s $BASE/maven-metadata.xml | grep -o '<version>[^<]*</version>' | tr -d ' ' | tail -60
          LATEST=$(curl -s $BASE/maven-metadata.xml | grep -o '<latest>[^<]*</latest>')
          echo "=== latest tag: $LATEST ==="
          V=$(curl -s $BASE/maven-metadata.xml | grep -o '<version>[^<]*</version>' | sed 's/<[^>]*>//g' | tail -1)
          echo "=== pom of $V ==="
          curl -s $BASE/$V/paper-api-$V.pom | head -60
          echo "=== paper project api ==="
          curl -s https://api.papermc.io/v2/projects/paper | head -c 2000 || true
          echo
          echo "=== fill api ==="
          curl -s "https://fill.papermc.io/v3/projects/paper" | head -c 3000 || true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: ArabicTranslator
          path: build/libs/ArabicTranslator-*.jar
          if-no-files-found: error
