# --- Paper -----------------------------------------------------------------
# Which Paper line to build for. Paper switched to CalVer after 1.21.11, and
# 26.x ships Adventure 5 where 1.21.x ships Adventure 4, so the two are not
# binary compatible: a jar has to be built for one or the other.
#
#   ./gradlew build                     -> the default below (1.21.x)
#   ./gradlew build -Ptarget=paper26    -> Paper 26.x
#
# CI builds both on every push.
# Each target also pins its own Java: paper-api 26.x is compiled for Java 25 and
# Gradle refuses to put it on a Java 21 classpath.
target=paper121

paperApiVersion.paper121=1.21.11-R0.1-SNAPSHOT
apiVersion.paper121=1.21
label.paper121=mc1.21
javaVersion.paper121=21

paperApiVersion.paper26=26.2.build.121-stable
apiVersion.paper26=26.2
label.paper26=mc26
javaVersion.paper26=25

# --- Library versions ------------------------------------------------------
coroutinesVersion=1.11.0
gsonVersion=2.14.0
pinyin4jVersion=2.5.1
junitVersion=6.1.3

# --- Gradle ----------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
kotlin.code.style=official
