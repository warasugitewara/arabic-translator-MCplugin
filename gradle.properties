# --- Toolchain -------------------------------------------------------------
javaVersion=21

# --- Paper -----------------------------------------------------------------
# The Paper API the plugin compiles against. `apiVersion` is what ends up in
# paper-plugin.yml and decides the minimum server the plugin will load on.
paperApiVersion=1.21.8-R0.1-SNAPSHOT
apiVersion=1.21

# --- Library versions ------------------------------------------------------
kotlinVersion=2.4.10
coroutinesVersion=1.11.0
gsonVersion=2.14.0
junitVersion=6.1.3

# --- Gradle ----------------------------------------------------------------
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
kotlin.code.style=official
