name: ArabicTranslator
version: '${version}'
main: com.warasugi.arabictranslator.ArabicTranslatorPlugin
api-version: '${apiVersion}'
description: '${description}'
authors:
  - Warasugi
website: https://github.com/warasugitewara/arabic-translator-MCplugin

permissions:
  translator.help:
    description: Use the language commands and see the help
    default: true
  translator.status:
    description: Check translation status
    default: true
  translator.toggle:
    description: Show or hide translations for yourself
    default: true
  translator.enable:
    description: Turn a language on server-wide
    default: op
  translator.disable:
    description: Turn a language off server-wide
    default: op
  translator.reload:
    description: Reload config.yml
    default: op
  translator.*:
    description: Every ArabicTranslator permission
    default: op
    children:
      translator.help: true
      translator.status: true
      translator.toggle: true
      translator.enable: true
      translator.disable: true
      translator.reload: true

  # Kept so permission setups written for the 1.x plugins keep working after the
  # two were merged into one.
  arabic.*:
    description: Legacy alias for translator.*
    default: op
    children:
      translator.*: true
  chinese.*:
    description: Legacy alias for translator.*
    default: op
    children:
      translator.*: true
